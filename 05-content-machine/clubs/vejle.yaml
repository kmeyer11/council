# One file per club/account. Templates take every name, colour and text string
# from here, so a template never names a club. See ../CONTEXT.md.
name: Vejle Boldklub
short_name: Vejle
language: da
handle: "@vejle.boldklub"   # placeholder until the account exists

api:
  source: apifootball
  team_id: 395   # from `teams --search Vejle`

colors:
  primary: "#D2232A"
  on_primary: "#FFFFFF"   # text on top of primary
  accent: "#FFFFFF"
  dark: "#141414"
  light: "#FFFFFF"

fonts:
  url: "https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700&display=swap"
  display: Oswald
  body: Inter

logo: media/crests/395.png   # our crest on the scoreboard

# API-Football spells Danish clubs in English/without æøå. Key = API spelling.
# Add a line whenever a graphic shows the wrong name.
team_names:
  FC Copenhagen: FC København
  Brondby: Brøndby
  Aarhus: AGF
  Odense: OB
  Aalborg: AaB
  Midtjylland: FC Midtjylland
  FC Nordsjaelland: FC Nordsjælland
  Sonderjyske: Sønderjyske
  Silkeborg: Silkeborg IF
  Randers FC: Randers FC
  Viborg: Viborg FF

# API round name -> ours. "{n}" is the round number ("Relegation Round - 10").
# Regular-season rounds use strings.round instead.
round_names:
  Relegation Round: "Nedrykningsspil, runde {n}"
  Championship Round: "Mesterskabsspil, runde {n}"
  Quarter-finals: Kvartfinale
  Semi-finals: Semifinale
  Final: Finale

competition_names:
  Superliga: 3F Superliga
  DBU Pokalen: Oddset Pokalen

strings:
  full_time: Fuldtid
  round: "Runde {n}"
  penalties: "{score} efter straffespark"
  goal_pen: str.
  goal_og: selvmål
  breaking: Breaking
  statement: Klubudtalelse
  transfer_in: Velkommen
  transfer_out: Farvel
  transfer_loan_in: Lejeaftale
  transfer_loan_out: Udlejet
  transfer_extension: Forlænger
  from: Fra
  to: Til
  contract_until: Kontrakt til
  fee: Pris
  position: Position
  injury_update: Skadesopdatering
  expected_return: Forventet tilbage
  status_out: Ude
  status_doubtful: Tvivlsom
  status_back: Tilbage
