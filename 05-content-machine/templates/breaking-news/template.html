{% extends "_layout.html" %}
{% block head %}
<style>
  .headline { font-size: 132px; line-height: 1.02; max-height: 520px; overflow: hidden; }
  .body-text { max-height: 230px; overflow: hidden; }
</style>
{% endblock %}
{% block content %}
<div class="layer">
  <div class="spacer"></div>
  <div class="kicker">{{ post.get('kicker') or s.breaking }}</div>
  <div class="headline display fit">{{ post.headline }}</div>
  {% if post.get('body') %}
  <div class="accent-bar"></div>
  <div class="body-text fit">{{ post.body }}</div>
  {% endif %}
</div>
{% endblock %}
{% block footer %}{{ post.date | longdate }}{% endblock %}
