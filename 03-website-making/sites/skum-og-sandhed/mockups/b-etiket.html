<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skum og Sandhed — Etiket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bevan&family=Libre+Franklin:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9EDF2;
    --paper-raised:#F7F8FA;
    --cobalt:#1F3A8A;
    --cobalt-soft:#5A6F9E;
    --gold:#D8A93B;
    --stamp:#B3261E;
    --rule:#C3CBD9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--cobalt);
    font-family:'Libre Franklin',system-ui,sans-serif;
    font-size:16px;
    line-height:1.55;
  }

  /* Heroen er en ølflaske-etiket: oval med buet tekst, dobbelt ramme. */
  .label-hero{
    background:var(--cobalt);
    padding:56px 16px 64px;
    display:grid; place-items:center;
  }
  .oval{
    width:min(620px, 100%);
    aspect-ratio:1.55;
    border-radius:50%;
    background:var(--paper-raised);
    box-shadow:0 0 0 6px var(--cobalt), 0 0 0 9px var(--gold);
    display:grid; place-items:center;
    position:relative;
    text-align:center;
  }
  .oval svg{ position:absolute; inset:0; width:100%; height:100%; }
  .oval svg text{ font-family:'Libre Franklin',sans-serif; font-weight:700; font-size:22px; letter-spacing:.18em; fill:var(--stamp); }
  .oval h1{
    margin:0; font-family:'Bevan',Georgia,serif; font-weight:400;
    font-size:clamp(2.2rem, 8.5vw, 4.6rem); line-height:.95; color:var(--cobalt);
  }
  .oval .est{ margin-top:10px; font-size:.95rem; color:var(--cobalt-soft); }

  main{ max-width:1160px; margin:0 auto; padding:48px 16px 80px; }
  .intro{ max-width:60ch; margin:0 auto 36px; text-align:center; font-size:1.1rem; }

  .tools{ display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; border-top:3px double var(--cobalt); border-bottom:1px solid var(--cobalt); padding:12px 0; margin-bottom:8px; }
  .tools h2{ margin:0; font-family:'Bevan',serif; font-weight:400; font-size:1.4rem; }
  .search{ font:inherit; color:var(--cobalt); background:var(--paper-raised); border:1px solid var(--cobalt); padding:8px 12px; min-width:min(280px,100%); }
  .search:focus-visible, th button:focus-visible, tbody tr:focus-visible, dialog button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; min-width:900px; font-variant-numeric:tabular-nums; }
  th{ text-align:left; font-size:.85rem; font-weight:700; padding:0; border-bottom:1px solid var(--cobalt); }
  th button{ all:unset; cursor:pointer; display:block; padding:10px 8px; }
  th[aria-sort] button{ color:var(--stamp); }
  th[aria-sort] button::after{ content:" ▾"; }
  th[aria-sort="ascending"] button::after{ content:" ▴"; }
  td{ padding:12px 8px; border-bottom:1px dotted var(--rule); }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:var(--paper-raised); }
  td.name{ font-family:'Bevan',serif; font-size:1.05rem; }
  td.num{ text-align:right; }
  td.muted{ color:var(--cobalt-soft); }

  /* Kapsel-badge: Røvernes rating som ølkapsel med takket kant. */
  .cap{
    --c:var(--stamp);
    display:inline-grid; place-items:center; width:44px; height:44px;
    font-weight:700; font-size:.9rem; color:#fff;
    background:
      radial-gradient(circle, var(--c) 58%, transparent 59%),
      repeating-conic-gradient(var(--c) 0 10deg, transparent 10deg 20deg);
    border-radius:50%;
  }
  .cap.u{ --c:var(--cobalt-soft); width:36px; height:36px; font-size:.8rem; }

  dialog{ border:none; background:transparent; padding:16px; max-width:min(640px, 100%); width:100%; }
  dialog::backdrop{ background:rgba(31,58,138,.8); }
  .card{
    background:var(--paper-raised); color:var(--cobalt);
    border:3px double var(--cobalt); outline:6px solid var(--paper-raised); outline-offset:0;
    padding:32px 28px; text-align:center; position:relative;
  }
  .card .close{ position:absolute; top:8px; right:12px; border:none; background:none; font-size:1.6rem; color:var(--cobalt); cursor:pointer; }
  .card .brew{ margin:0; color:var(--stamp); font-weight:700; font-size:.9rem; letter-spacing:.08em; }
  .card h3{ margin:6px 0 4px; font-family:'Bevan',serif; font-weight:400; font-size:2.2rem; line-height:1.05; }
  .card .types{ margin:0 0 18px; color:var(--cobalt-soft); }
  .card .scores{ display:flex; justify-content:center; gap:28px; align-items:center; margin-bottom:18px; }
  .card .scores div{ display:grid; justify-items:center; gap:4px; font-size:.85rem; }
  .card .scores .cap{ width:64px; height:64px; font-size:1.2rem; }
  .card .scores .cap.u{ width:52px; height:52px; font-size:1rem; }
  .card p.desc{ font-size:1.05rem; max-width:48ch; margin:0 auto 20px; }
  .spec{ display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--cobalt); border-bottom:1px solid var(--cobalt); margin:0 0 18px; }
  .spec div{ padding:10px 4px; }
  .spec div + div{ border-left:1px solid var(--rule); }
  .spec dt{ font-size:.75rem; color:var(--cobalt-soft); }
  .spec dd{ margin:0; font-weight:700; }
  @media (max-width:520px){ .spec{ grid-template-columns:repeat(2,1fr); } .spec div:nth-child(3){ border-left:none; } }
  .ing{ text-align:left; display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:.95rem; margin:0; }
  .ing dt{ font-weight:700; }
  .ing dd{ margin:0; }

  footer{ text-align:center; padding:24px 16px 40px; color:var(--cobalt-soft); font-size:.9rem; }
</style>
</head>
<body>
<header class="label-hero">
  <div class="oval">
    <svg viewBox="0 0 620 400" aria-hidden="true">
      <path id="arc" d="M 110 190 A 200 140 0 0 1 510 190" fill="none"/>
      <text text-anchor="middle"><textPath href="#arc" startOffset="50%">RØVERNE PRÆSENTERER</textPath></text>
    </svg>
    <div>
      <h1>Skum og<br>Sandhed</h1>
      <div class="est">Smagt, vurderet og skrevet ned</div>
    </div>
  </div>
</header>

<main>
  <p class="intro">Hver øl Røverne har åbnet, med vores egen karakter ved siden af Untappd. Klik på en øl for at se etiketten.</p>
  <div class="tools">
    <h2 id="count"></h2>
    <input class="search" type="search" placeholder="Søg i navn, bryggeri eller type" aria-label="Søg">
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th data-k="name"><button>Navn</button></th>
        <th data-k="releaseYear"><button>Bryg år</button></th>
        <th data-k="drinkingYear"><button>Druk år</button></th>
        <th data-k="abv"><button>ABV</button></th>
        <th data-k="fermentation"><button>Gæring</button></th>
        <th data-k="yeastType"><button>Gærtype</button></th>
        <th data-k="price"><button>Pris</button></th>
        <th data-k="rating" aria-sort="descending"><button>Røverne</button></th>
        <th data-k="untappdRating"><button>Untappd</button></th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<footer>Tappet fra Røvernes regneark</footer>

<dialog id="beer">
  <div class="card">
    <button class="close" aria-label="Luk">×</button>
    <p class="brew"></p>
    <h3></h3>
    <p class="types"></p>
    <div class="scores"></div>
    <p class="desc"></p>
    <dl class="spec"></dl>
    <dl class="ing"></dl>
  </div>
</dialog>

<script src="data.js"></script>
<script>
  const kr = n => n.toLocaleString('da-DK') + ' kr';
  const pct = n => n.toLocaleString('da-DK', {minimumFractionDigits:1}) + ' %';
  const dec = n => n.toLocaleString('da-DK', {minimumFractionDigits:1, maximumFractionDigits:2});

  const tbody = document.querySelector('tbody');
  const search = document.querySelector('.search');
  let sortKey = 'rating', dir = -1;

  function render(){
    const q = search.value.trim().toLowerCase();
    const rows = BEERS
      .filter(b => !q || [b.name, ...b.breweries, ...b.types].join(' ').toLowerCase().includes(q))
      .sort((a,b) => (a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0) * dir);
    document.getElementById('count').textContent = rows.length + ' øl i arkivet';
    tbody.innerHTML = rows.map(b => `
      <tr tabindex="0" data-i="${BEERS.indexOf(b)}">
        <td class="name">${b.name}</td>
        <td>${b.releaseYear}</td><td>${b.drinkingYear}</td>
        <td class="num">${pct(b.abv)}</td>
        <td>${b.fermentation}</td><td>${b.yeastType}</td>
        <td class="num">${kr(b.price)}</td>
        <td><span class="cap">${dec(b.rating)}</span></td>
        <td><span class="cap u">${dec(b.untappdRating)}</span></td>
      </tr>`).join('');
  }

  document.querySelectorAll('th').forEach(th => th.querySelector('button').addEventListener('click', () => {
    const k = th.dataset.k;
    dir = sortKey === k ? -dir : 1; sortKey = k;
    document.querySelectorAll('th').forEach(t => t.removeAttribute('aria-sort'));
    th.setAttribute('aria-sort', dir === 1 ? 'ascending' : 'descending');
    render();
  }));
  search.addEventListener('input', render);

  const dlg = document.getElementById('beer');
  const list = l => l.length ? l.join(', ') : 'Ingen';
  function open(b){
    dlg.querySelector('.brew').textContent = b.breweries.join(' & ');
    dlg.querySelector('h3').textContent = b.name;
    dlg.querySelector('.types').textContent = b.types.join(', ');
    dlg.querySelector('.scores').innerHTML = `
      <div><span class="cap">${dec(b.rating)}</span>Røverne</div>
      <div><span class="cap u">${dec(b.untappdRating)}</span>Untappd</div>`;
    dlg.querySelector('.desc').textContent = b.description;
    dlg.querySelector('.spec').innerHTML = [
      ['ABV', pct(b.abv)], ['Pris', kr(b.price)], ['Brygget', b.releaseYear], ['Drukket', b.drinkingYear]
    ].map(([k,v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
    dlg.querySelector('.ing').innerHTML = `
      <dt>Gæring</dt><dd>${b.fermentation}, ${b.yeastType.toLowerCase()}gær</dd>
      <dt>Humle</dt><dd>${list(b.hops)}</dd>
      <dt>Malt</dt><dd>${list(b.malts)}</dd>
      <dt>Adjuncts</dt><dd>${list(b.adjuncts)}</dd>
      <dt>Passer til</dt><dd>${b.foodPairing}</dd>`;
    dlg.showModal();
  }
  tbody.addEventListener('click', e => { const tr = e.target.closest('tr'); if (tr) open(BEERS[tr.dataset.i]); });
  tbody.addEventListener('keydown', e => { if (e.key === 'Enter') { const tr = e.target.closest('tr'); if (tr) open(BEERS[tr.dataset.i]); } });
  dlg.querySelector('.close').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  render();
</script>
</body>
</html>
