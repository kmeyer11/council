type: invitation
slug: example
kicker: Invitation        # small orange label above the title (default "Invitation")
title: Hike i Rold Skov
subtitle: To dage, én sovepose og en masse bål. Kom med!   # optional

# Weekday, month and time are written by the template, so only dates go here.
# "2026-11-07" for a day, "2026-11-07 10:00" for a day + time. `ends` is optional.
starts: "2026-11-07 10:00"
ends: "2026-11-08 14:00"

where: Rold Skov
where_detail: P-pladsen ved Store Økssø   # optional second line

text: |
  Vi går ca. 25 km gennem Danmarks største skov over to dage og sover i shelter ved søen lørdag nat. Undervejs laver vi mad over bål og tager en tur i det kolde vand for dem, der tør.

  Mad står vi for, du står for godt humør. Tag gerne en ven med!

bring:                    # optional list
  - Sovepose og liggeunderlag
  - Varmt tøj og regntøj
  - Gode vandrestøvler
  - Madpakke til lørdag frokost

signup: 150 kr. til Sigurd på MobilePay senest 1. november   # optional: shown under "Tilmelding" (price, who to pay, deadline)

facebook:                 # footer pointing to the Facebook event people answer in; leave out the whole block for no footer
  deadline: "2026-11-01"  # optional: printed as "Svar senest søndag 1. november"
  text: null              # optional extra line, e.g. Find den i Røvernes gruppe

closing: Vel mødt         # sign-off at the bottom (default "Vel mødt"); "" for none

photo: null               # e.g. hike-2025/bål.jpg, relative to media_dir (list them with `photos`); null = brand background
photo_position: center    # CSS object-position, e.g. "center 30%" to move the crop

formats: [post, a5]       # post (1080×1350 PNG), story (1080×1920 PNG), a5 / a4 (PDF for print)
